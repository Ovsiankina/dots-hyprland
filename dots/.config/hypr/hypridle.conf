# RESOLVED 2026-06-04: qs lock fixed (was a deleted wallpaper -> null image source; see quickshell/LOCKSCREEN-RESOLVED.md). Use the qs lock.
$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")'
# Fallback if the qs lock ever regresses: $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

# Auto-lock on idle DISABLED by default (2026-11-08). Uncomment to re-enable.
# listener {
#     timeout = 300 # 5mins
#     on-timeout = loginctl lock-session
# }

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Idle suspend DISABLED too: suspend runs before_sleep_cmd -> lock, so it would auto-lock anyway.
