general {
    col.active_border = rgba(9d8ba077)
    col.inactive_border = rgba(50425555)
}

misc {
    background_color = rgba(18111aFF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(18111aFF)
        col.text = rgba(ecdeecFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(ecdeec), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(ecdeec), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(ecdeec), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(b2c5ffAA) rgba(b2c5ff77), match:pin 1
